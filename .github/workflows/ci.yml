name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit and API tests
        run: pytest -q
        working-directory: backend
      - name: Every requirement has a test
        run: python scripts/check_traceability.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sat-planner .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name app -p 8000:8000 -e SAT_SOURCE=demo sat-planner
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break || sleep 1; done
          curl -fs localhost:8000/api/health | grep '"status":"ok"'

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No RENDER_DEPLOY_HOOK secret set; skipping deploy."; else curl -fsS -X POST "$HOOK"; fi
